name: Build Android Signed APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Signed Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UtangHandler-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: UtangHandler Android Release v1.0.${{ github.run_number }}
          body: |
            ## 📱 UtangHandler Android APK Ready for Installation!
            
            Download `app-debug.apk` below and install it directly on your Android phone.
            
            - 100% Offline Database (IndexedDB)
            - Built-in Calculator
            - Customer Directory & Auto-Date Capture
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
